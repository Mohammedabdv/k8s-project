apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: fashionista
  labels:
    app: fashionista-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fashionista-frontend
  template:
    metadata:
      labels:
        app: fashionista-frontend
    spec:
      containers:
        - name: frontend
          image: mohammedabdv/fashionista-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
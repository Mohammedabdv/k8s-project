version: '3.9'

services:

  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:6-jammy
    container_name: fashionista-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: fashionista
    networks:
      - fashionista-net

  # ── Backend ───────────────────────────────────────────────────────────────────
  fashionista-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fashionista-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DATABASE: mongodb://mongodb:27017/fashionista
      SECRET: change_this_secret_key
      STRIPE_SECRET_KEY: sk_test_xxxxxxxxxxxx
      BRAINTREE_MERCHANT_ID: your_merchant_id
      BRAINTREE_PUBLIC_KEY: your_public_key
      BRAINTREE_PRIVATE_KEY: your_private_key
    depends_on:
      - mongodb
    networks:
      - fashionista-net

  # ── Frontend ──────────────────────────────────────────────────────────────────
  fashionista-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
    container_name: fashionista-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - fashionista-backend
    networks:
      - fashionista-net

volumes:
  mongo_data:

networks:
  fashionista-net:
    driver: bridge